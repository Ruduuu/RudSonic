<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RudSonic</title>

  <!-- Inter font from Google Fonts CDN (loaded inside CEP Chromium) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="css/rudsonic.css" />
</head>

<body>

  <!-- ══════════════════════════════════════════════
       HEADER: Logo + Nav Tabs
  ══════════════════════════════════════════════ -->
  <header class="rs-header">
    <div class="rs-logo">
      <svg class="rs-logo-icon" viewBox="0 0 24 24" fill="none">
        <path d="M9 18V5l12-2v13" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="6" cy="18" r="3" stroke="currentColor" stroke-width="2"/>
        <circle cx="18" cy="16" r="3" stroke="currentColor" stroke-width="2"/>
      </svg>
      <span class="rs-logo-text">RudSonic</span>
    </div>
    <nav class="rs-tabs">
      <button class="rs-tab active" data-tab="music">
        <svg viewBox="0 0 20 20" fill="currentColor"><path d="M18 3a1 1 0 00-1.196-.98l-10 2A1 1 0 006 5v9.114A4.369 4.369 0 005 14c-1.657 0-3 .895-3 2s1.343 2 3 2 3-.895 3-2V7.82l8-1.6v5.894A4.37 4.37 0 0015 12c-1.657 0-3 .895-3 2s1.343 2 3 2 3-.895 3-2V3z"/></svg>
        Music
      </button>
      <button class="rs-tab" data-tab="sfx">
        <svg viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M9.383 3.076A1 1 0 0110 4v12a1 1 0 01-1.707.707L4.586 13H2a1 1 0 01-1-1V8a1 1 0 011-1h2.586l3.707-3.707a1 1 0 011.09-.217zM14.657 2.929a1 1 0 011.414 0A9.972 9.972 0 0119 10a9.972 9.972 0 01-2.929 7.071 1 1 0 01-1.414-1.414A7.971 7.971 0 0017 10c0-2.21-.894-4.208-2.343-5.657a1 1 0 010-1.414zm-2.829 2.828a1 1 0 011.415 0A5.983 5.983 0 0115 10a5.984 5.984 0 01-1.757 4.243 1 1 0 01-1.415-1.415A3.984 3.984 0 0013 10a3.983 3.983 0 00-1.172-2.828 1 1 0 010-1.415z" clip-rule="evenodd"/></svg>
        Sound Effects
      </button>
      <button class="rs-tab" data-tab="favorites">
        <svg viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M3.172 5.172a4 4 0 015.656 0L10 6.343l1.172-1.171a4 4 0 115.656 5.656L10 17.657l-6.828-6.829a4 4 0 010-5.656z" clip-rule="evenodd"/></svg>
        Favorites
      </button>
    </nav>
  </header>

  <!-- ══════════════════════════════════════════════
       MUSIC PAGE
  ══════════════════════════════════════════════ -->
  <section id="page-music" class="rs-page active">

    <!-- Search -->
    <div class="rs-search-wrap">
      <svg class="rs-search-icon" viewBox="0 0 20 20" fill="currentColor">
        <path fill-rule="evenodd" d="M8 4a4 4 0 100 8 4 4 0 000-8zM2 8a6 6 0 1110.89 3.476l4.817 4.817a1 1 0 01-1.414 1.414l-4.816-4.816A6 6 0 012 8z" clip-rule="evenodd"/>
      </svg>
      <input id="music-search" class="rs-search-input" type="text" placeholder="Search music — cinematic, lofi, ambient…" autocomplete="off" spellcheck="false" />
      <button id="music-search-clear" class="rs-search-clear hidden">✕</button>
    </div>

    <!-- Genre Chips -->
    <div class="rs-chips-wrap" id="music-genre-chips">
      <button class="rs-chip active" data-genre="">All</button>
      <button class="rs-chip" data-genre="cinematic">Cinematic</button>
      <button class="rs-chip" data-genre="ambient">Ambient</button>
      <button class="rs-chip" data-genre="lofi">Lo-Fi</button>
      <button class="rs-chip" data-genre="electronic">Electronic</button>
      <button class="rs-chip" data-genre="hiphop">Hip-Hop</button>
      <button class="rs-chip" data-genre="corporate">Corporate</button>
      <button class="rs-chip" data-genre="emotional">Emotional</button>
      <button class="rs-chip" data-genre="motivational">Motivational</button>
      <button class="rs-chip" data-genre="jazz">Jazz</button>
      <button class="rs-chip" data-genre="rock">Rock</button>
    </div>

    <!-- Filters row -->
    <div class="rs-filters-row">
      <div class="rs-filter-group">
        <label class="rs-filter-label">Mood</label>
        <select id="music-mood" class="rs-select">
          <option value="">Any</option>
          <option value="happy">Happy</option>
          <option value="sad">Sad</option>
          <option value="epic">Epic</option>
          <option value="dark">Dark</option>
          <option value="chill">Chill</option>
          <option value="romantic">Romantic</option>
          <option value="energetic">Energetic</option>
          <option value="peaceful">Peaceful</option>
        </select>
      </div>
      <div class="rs-filter-group">
        <label class="rs-filter-label">Duration</label>
        <select id="music-duration" class="rs-select">
          <option value="600">Any</option>
          <option value="60">Under 1 min</option>
          <option value="120">Under 2 min</option>
          <option value="300">Under 5 min</option>
        </select>
      </div>
    </div>

    <!-- Track list -->
    <div class="rs-section-header">
      <span id="music-section-title" class="rs-section-title">🔥 Trending</span>
      <span id="music-count" class="rs-section-count"></span>
    </div>
    <div id="music-list" class="rs-track-list">
      <!-- Skeleton loaders -->
      <div class="rs-skeleton-item"></div>
      <div class="rs-skeleton-item"></div>
      <div class="rs-skeleton-item"></div>
      <div class="rs-skeleton-item"></div>
      <div class="rs-skeleton-item"></div>
    </div>
    <button id="music-load-more" class="rs-load-more hidden">Load more</button>
  </section>

  <!-- ══════════════════════════════════════════════
       SFX PAGE
  ══════════════════════════════════════════════ -->
  <section id="page-sfx" class="rs-page">

    <!-- Search -->
    <div class="rs-search-wrap">
      <svg class="rs-search-icon" viewBox="0 0 20 20" fill="currentColor">
        <path fill-rule="evenodd" d="M8 4a4 4 0 100 8 4 4 0 000-8zM2 8a6 6 0 1110.89 3.476l4.817 4.817a1 1 0 01-1.414 1.414l-4.816-4.816A6 6 0 012 8z" clip-rule="evenodd"/>
      </svg>
      <input id="sfx-search" class="rs-search-input" type="text" placeholder="Search sound effects — whoosh, boom…" autocomplete="off" spellcheck="false" />
      <button id="sfx-search-clear" class="rs-search-clear hidden">✕</button>
    </div>

    <!-- SFX Layout: sidebar + list -->
    <div class="rs-sfx-layout">

      <!-- Category Sidebar -->
      <aside class="rs-sfx-sidebar" id="sfx-category-sidebar">
        <button class="rs-category-btn active" data-category="">All</button>
        <button class="rs-category-btn" data-category="whooshes">
          <span class="rs-cat-emoji">💨</span> Whooshes
        </button>
        <button class="rs-category-btn" data-category="transitions">
          <span class="rs-cat-emoji">⚡</span> Transitions
        </button>
        <button class="rs-category-btn" data-category="impacts">
          <span class="rs-cat-emoji">💥</span> Impacts
        </button>
        <button class="rs-category-btn" data-category="risers">
          <span class="rs-cat-emoji">📈</span> Risers
        </button>
        <button class="rs-category-btn" data-category="cinematic-hits">
          <span class="rs-cat-emoji">🎬</span> Cinematic
        </button>
        <button class="rs-category-btn" data-category="ui-sounds">
          <span class="rs-cat-emoji">🖱️</span> UI Sounds
        </button>
        <button class="rs-category-btn" data-category="footsteps">
          <span class="rs-cat-emoji">👟</span> Footsteps
        </button>
        <button class="rs-category-btn" data-category="ambience">
          <span class="rs-cat-emoji">🌧️</span> Ambience
        </button>
        <button class="rs-category-btn" data-category="nature">
          <span class="rs-cat-emoji">🌿</span> Nature
        </button>
        <button class="rs-category-btn" data-category="sci-fi">
          <span class="rs-cat-emoji">🛸</span> Sci-Fi
        </button>
        <button class="rs-category-btn" data-category="foley">
          <span class="rs-cat-emoji">🎭</span> Foley
        </button>
        <button class="rs-category-btn" data-category="doors">
          <span class="rs-cat-emoji">🚪</span> Doors
        </button>
        <button class="rs-category-btn" data-category="vehicles">
          <span class="rs-cat-emoji">🚗</span> Vehicles
        </button>
      </aside>

      <!-- SFX List -->
      <div class="rs-sfx-main">
        <div class="rs-section-header">
          <span id="sfx-section-title" class="rs-section-title">🔥 Trending SFX</span>
          <span id="sfx-count" class="rs-section-count"></span>
        </div>
        <div id="sfx-list" class="rs-sfx-list">
          <div class="rs-skeleton-item"></div>
          <div class="rs-skeleton-item"></div>
          <div class="rs-skeleton-item"></div>
          <div class="rs-skeleton-item"></div>
          <div class="rs-skeleton-item"></div>
        </div>
        <button id="sfx-load-more" class="rs-load-more hidden">Load more</button>
      </div>
    </div>
  </section>

  <!-- ══════════════════════════════════════════════
       FAVORITES PAGE
  ══════════════════════════════════════════════ -->
  <section id="page-favorites" class="rs-page">
    <div class="rs-fav-header">
      <h2 class="rs-fav-title">❤️ Favorites</h2>
      <p class="rs-fav-subtitle">Your saved music & sound effects</p>
    </div>
    <div class="rs-sub-tabs">
      <button class="rs-sub-tab active" data-subtab="fav-music">Music</button>
      <button class="rs-sub-tab" data-subtab="fav-sfx">Sound Effects</button>
    </div>
    <div id="fav-music" class="rs-fav-list active">
      <!-- Populated by favorites.js -->
    </div>
    <div id="fav-sfx" class="rs-fav-list">
      <!-- Populated by favorites.js -->
    </div>
    <div id="fav-empty" class="rs-empty-state hidden">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M21 8.25c0-2.485-2.099-4.5-4.688-4.5-1.935 0-3.597 1.126-4.312 2.733-.715-1.607-2.377-2.733-4.313-2.733C5.1 3.75 3 5.765 3 8.25c0 7.22 9 12 9 12s9-4.78 9-12z"/></svg>
      <p>No favorites yet</p>
      <span>Click the ❤️ on any track to save it here</span>
    </div>
  </section>

  <!-- ══════════════════════════════════════════════
       BOTTOM PLAYER BAR
  ══════════════════════════════════════════════ -->
  <footer class="rs-player" id="rs-player">
    <div class="rs-player-art-wrap">
      <img id="player-art" class="rs-player-art" src="" alt="" />
      <div class="rs-player-art-placeholder">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M9 18V5l12-2v13M6 21a3 3 0 100-6 3 3 0 000 6zm12-2a3 3 0 100-6 3 3 0 000 6z"/></svg>
      </div>
    </div>
    <div class="rs-player-info">
      <span id="player-title" class="rs-player-title">No track selected</span>
      <span id="player-artist" class="rs-player-artist"></span>
    </div>
    <div class="rs-player-center">
      <div class="rs-player-controls">
        <button id="player-prev" class="rs-ctrl-btn" title="Previous">
          <svg viewBox="0 0 20 20" fill="currentColor"><path d="M8.445 14.832A1 1 0 0010 14v-2.798l5.445 3.63A1 1 0 0017 14V6a1 1 0 00-1.555-.832L10 8.798V6a1 1 0 00-1.555-.832l-6 4a1 1 0 000 1.664l6 4z"/></svg>
        </button>
        <button id="player-play" class="rs-play-btn" title="Play / Pause">
          <svg class="icon-play" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM9.555 7.168A1 1 0 008 8v4a1 1 0 001.555.832l3-2a1 1 0 000-1.664l-3-2z" clip-rule="evenodd"/></svg>
          <svg class="icon-pause hidden" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zM7 8a1 1 0 012 0v4a1 1 0 11-2 0V8zm5-1a1 1 0 00-1 1v4a1 1 0 102 0V8a1 1 0 00-1-1z" clip-rule="evenodd"/></svg>
        </button>
        <button id="player-next" class="rs-ctrl-btn" title="Next">
          <svg viewBox="0 0 20 20" fill="currentColor"><path d="M4.555 5.168A1 1 0 003 6v8a1 1 0 001.555.832L10 11.202V14a1 1 0 001.555.832l6-4a1 1 0 000-1.664l-6-4A1 1 0 0010 6v2.798L4.555 5.168z"/></svg>
        </button>
      </div>
      <div class="rs-player-progress-wrap">
        <span id="player-current" class="rs-player-time">0:00</span>
        <div class="rs-progress-bar" id="rs-progress-bar">
          <div class="rs-progress-fill" id="rs-progress-fill"></div>
          <div class="rs-progress-thumb" id="rs-progress-thumb"></div>
        </div>
        <span id="player-duration" class="rs-player-time">0:00</span>
      </div>
    </div>
    <div class="rs-player-right">
      <div class="rs-volume-wrap" title="Volume">
        <svg class="rs-vol-icon" viewBox="0 0 20 20" fill="currentColor">
          <path fill-rule="evenodd" d="M9.383 3.076A1 1 0 0110 4v12a1 1 0 01-1.707.707L4.586 13H2a1 1 0 01-1-1V8a1 1 0 011-1h2.586l3.707-3.707a1 1 0 011.09-.217zM14.657 2.929a1 1 0 011.414 0A9.972 9.972 0 0119 10a9.972 9.972 0 01-2.929 7.071 1 1 0 01-1.414-1.414A7.971 7.971 0 0017 10c0-2.21-.894-4.208-2.343-5.657a1 1 0 010-1.414zm-2.829 2.828a1 1 0 011.415 0A5.983 5.983 0 0115 10a5.984 5.984 0 01-1.757 4.243 1 1 0 01-1.415-1.415A3.984 3.984 0 0013 10a3.983 3.983 0 00-1.172-2.828 1 1 0 010-1.415z" clip-rule="evenodd"/>
        </svg>
        <input id="player-volume" class="rs-volume-slider" type="range" min="0" max="1" step="0.02" value="0.8" />
      </div>
      <button id="player-import" class="rs-import-btn hidden" title="Import to Premiere Pro">
        <svg viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M3 17a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zm3.293-7.707a1 1 0 011.414 0L9 10.586V3a1 1 0 112 0v7.586l1.293-1.293a1 1 0 111.414 1.414l-3 3a1 1 0 01-1.414 0l-3-3a1 1 0 010-1.414z" clip-rule="evenodd"/></svg>
        Import
      </button>
    </div>
  </footer>

  <!-- Toast notification -->
  <div id="rs-toast" class="rs-toast"></div>

  <!-- Scripts — order matters -->
  <script src="js/CSInterface.js"></script>
  <script src="js/api.js"></script>
  <script src="js/favorites.js"></script>
  <script src="js/player.js"></script>
  <script src="js/music.js"></script>
  <script src="js/sfx.js"></script>
  <script src="js/app.js"></script>

</body>
</html>
